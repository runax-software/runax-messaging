# Local infrastructure for integration tests.
#   docker compose up -d
#   dotnet test -- --filter-trait "Category=Integration"
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # SQS + SNS emulator (AWS endpoint on :4566).
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"

  # Google Cloud Pub/Sub emulator (endpoint on :8085; set PUBSUB_EMULATOR_HOST=localhost:8085).
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=runax-test --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  # Redis Streams transport is tested against both engines.
  # Valkey (a drop-in Redis fork) on :6379, Redis on :6380.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # Azure Service Bus emulator (needs a SQL backend). AMQP mapped to :5673 to avoid the RabbitMQ 5672 clash.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sqledge
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Runax_Str0ng_P@ss!"
    ports:
      - "5673:5672"
    volumes:
      - ./docker/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Runax_Str0ng_P@ss!"

  # Azure Event Hubs emulator (needs Azurite for storage + a mounted config). AMQP mapped to :5674
  # to avoid the RabbitMQ (:5672) and Service Bus (:5673) clashes.
  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    depends_on:
      - azurite
    environment:
      ACCEPT_EULA: "Y"
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    ports:
      - "5674:5672"
    volumes:
      - ./docker/eventhubs-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro

  # Azure Storage emulator: backs the Event Hubs emulator and the blob checkpoint store (blob on :10000).
  # --skipApiVersionCheck lets newer Azure.Storage SDKs talk to Azurite without an API-version mismatch.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  # Kafka in KRaft mode (no ZooKeeper). Bootstrap server on :9092.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
