# Local infrastructure for integration tests.
#   docker compose up -d
#   dotnet test -- --filter-trait "Category=Integration"
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # SQS + SNS emulator (AWS endpoint on :4566).
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"

  # Google Cloud Pub/Sub emulator (endpoint on :8085; set PUBSUB_EMULATOR_HOST=localhost:8085).
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=runax-test --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  # Redis Streams transport is tested against both engines.
  # Valkey (a drop-in Redis fork) on :6379, Redis on :6380.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
