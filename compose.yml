# Local infrastructure for integration tests.
#   docker compose up -d
#   dotnet test -- --filter-trait "Category=Integration"
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # SQS-compatible emulator (AWS endpoint on :4566).
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
