name: Setup .NET and Build
description: Checkout, setup .NET SDK, restore, and build the solution

inputs:
  dotnet-version:
    description: .NET SDK version
    required: false
    default: "10.0.x"
  warnings-as-errors:
    description: Treat warnings as errors during build
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore
      shell: bash
      run: dotnet restore

    - name: Build
      shell: bash
      run: dotnet build --no-restore ${{ inputs.warnings-as-errors == 'true' && '--warnaserror' || '' }}
