name: Setup .NET and Build
description: Checkout, setup .NET SDK, restore, and build the solution

inputs:
  dotnet-version:
    # The 10.0 SDK builds every target framework; the 8.0 and 9.0 SDKs are installed for the
    # runtimes that come with them, which is what runs the net8.0 and net9.0 test assemblies.
    # global.json pins the build to the 10.0 SDK regardless of install order.
    description: .NET SDK versions to install, one per line
    required: false
    default: |
      8.0.x
      9.0.x
      10.0.x
  warnings-as-errors:
    description: Treat warnings as errors during build
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore
      shell: bash
      run: dotnet restore

    - name: Build
      shell: bash
      run: dotnet build --no-restore ${{ inputs.warnings-as-errors == 'true' && '--warnaserror' || '' }}
