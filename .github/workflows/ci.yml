name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup and build
        uses: ./.github/actions/setup-dotnet-build
        with:
          warnings-as-errors: "true"

      - name: Unit tests
        run: dotnet test --no-build --verbosity normal -- --filter-not-trait "Category=Integration"

      - name: Format check
        run: dotnet format --verify-no-changes

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    # One job per transport. Heavy emulators (Pub/Sub, Service Bus) start only for the job that needs them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: Aws.Sqs
          - transport: Aws.Sns
          - transport: RabbitMq
          - transport: Redis
          - transport: Google.PubSub
            pubsub: true
          - transport: Azure.ServiceBus
            servicebus: true
          - transport: Azure.EventHubs
            eventhubs: true

    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # floci emulates both SQS and SNS.
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

      # Redis Streams transport is exercised against both engines.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v7

      - name: Setup and build
        uses: ./.github/actions/setup-dotnet-build

      # The Pub/Sub emulator needs a start command, which GitHub service containers cannot set,
      # so run it as a container (same image and port as compose.yml).
      - name: Start Pub/Sub emulator
        if: matrix.pubsub
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=runax-test --host-port=0.0.0.0:8085
          for _ in $(seq 1 30); do curl -sf http://localhost:8085 >/dev/null && break || sleep 2; done

      # The Service Bus emulator needs a SQL backend and a mounted config, so bring it up via compose.
      - name: Start Service Bus emulator
        if: matrix.servicebus
        run: |
          docker compose up -d sqledge servicebus
          # The emulator opens its AMQP port before it can serve requests, so a bare TCP check races
          # startup and yields "connection reset by peer". Wait for its readiness log instead.
          for _ in $(seq 1 60); do
            docker compose logs servicebus 2>&1 | grep -q "Emulator Service is Successfully Up" && break
            sleep 3
          done

      # The Event Hubs emulator needs Azurite for storage and a mounted config, so bring it up via compose.
      - name: Start Event Hubs emulator
        if: matrix.eventhubs
        run: |
          docker compose up -d azurite eventhubs
          # Wait for the emulator's readiness log rather than a bare TCP check (which races startup).
          for _ in $(seq 1 60); do
            docker compose logs eventhubs 2>&1 | grep -q "Emulator Service is Successfully Up" && break
            sleep 3
          done

      - name: Integration tests (${{ matrix.transport }})
        env:
          RABBITMQ_HOST: localhost
          AWS_SERVICE_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: >-
          dotnet test
          --project tests/Runax.Messaging.Transports.${{ matrix.transport }}.Tests/Runax.Messaging.Transports.${{ matrix.transport }}.Tests.csproj
          --no-build --verbosity normal -- --filter-trait "Category=Integration"
