name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup and build
        uses: ./.github/actions/setup-dotnet-build
        with:
          warnings-as-errors: "true"

      - name: Unit tests
        run: dotnet test --no-build --verbosity normal -- --filter-not-trait "Category=Integration"

      - name: Format check
        run: dotnet format --verify-no-changes

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

      # Redis Streams transport is exercised against both engines.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v7

      - name: Setup and build
        uses: ./.github/actions/setup-dotnet-build

      # The Pub/Sub emulator needs a start command, which GitHub service containers cannot set,
      # so run it as a container (same image and port as compose.yml).
      - name: Start Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=runax-test --host-port=0.0.0.0:8085
          for _ in $(seq 1 30); do curl -sf http://localhost:8085 >/dev/null && break || sleep 2; done

      # Run per transport project: a solution-wide run would report "zero tests ran"
      # (exit 8) for projects that have no integration tests. Add new transports here.
      - name: Integration tests
        env:
          RABBITMQ_HOST: localhost
          AWS_SERVICE_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: |
          dotnet test --project tests/Runax.Messaging.Transports.Aws.Sqs.Tests/Runax.Messaging.Transports.Aws.Sqs.Tests.csproj --no-build --verbosity normal -- --filter-trait "Category=Integration"
          dotnet test --project tests/Runax.Messaging.Transports.RabbitMq.Tests/Runax.Messaging.Transports.RabbitMq.Tests.csproj --no-build --verbosity normal -- --filter-trait "Category=Integration"
          dotnet test --project tests/Runax.Messaging.Transports.Google.PubSub.Tests/Runax.Messaging.Transports.Google.PubSub.Tests.csproj --no-build --verbosity normal -- --filter-trait "Category=Integration"
          dotnet test --project tests/Runax.Messaging.Transports.Redis.Tests/Runax.Messaging.Transports.Redis.Tests.csproj --no-build --verbosity normal -- --filter-trait "Category=Integration"
